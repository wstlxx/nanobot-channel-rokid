[project]
name = "nanobot-channel-rokid"
version = "0.1.0"
dependencies = ["nanobot-ai", "websockets", "pydantic"]

[project.entry-points."nanobot.channels"]
rokid = "nanobot_channel_rokid.channel:RokidChannel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanobot_channel_rokid"]